# Render blueprint: the fake NRS as a public web service, used by our test server instead of
# the NRS sandbox. Dev and test only: it never talks to NRS and holds no real data.
# Render dashboard → New → Blueprint → this repo. Set the two keys there (never in git): our
# server stores the same pair in its Vault at secret/nrs/fake.
services:
  - type: web
    name: einvoice-fake-nrs
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install ".[fake]"
    startCommand: python -m einvoice_nrs.fake --host 0.0.0.0   # port from $PORT
    healthCheckPath: /fake-nrs
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FAKE_NRS_API_KEY
        sync: false   # entered in the Render dashboard
      - key: FAKE_NRS_API_SECRET
        sync: false
